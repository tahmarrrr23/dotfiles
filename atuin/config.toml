update_check = false
style = "full"
history_filter = [
    "^cd(?:[[:space:]]|$)",
    "^code(?:[[:space:]]|$)",
    "^command[[:space:]]+-v(?:[[:space:]]|$)",
    "^git[[:space:]]+status(?:[[:space:]]|$)",
    "^history(?:[[:space:]]|$)",
    "^la$",
    "^ll$",
    "^ls(?:[[:space:]]|$)",
    "^pwd$",
    "^reload$",
]
command_chaining = true

[ui]
columns = ["exit", "datetime", "command"]
